<!DOCTYPE html>
<html lang="en">

<head>
    <title>Question 4 - JavaScript</title>

</head>

<body>
    <h1>HTML DOM Events</h1>
    <p>Trigger a function on hover, focus, and click that will output "Hello World":</p>

    <button onmouseover="myFunction()" onfocus="myFunction()" onclick="myFunction()">Action!</button>
    <p id="demo" aria-live="polite"></p>
<script>
    function myFunction() {
        document.getElementById("demo").innerHTML = "Hello World";
    }
</script>

</body>

</html>
